<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Frontend Quiz - Participante</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        touch-action: manipulation;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: white;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .join-container {
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }
      input {
        width: 100%;
        max-width: 320px;
        padding: 16px;
        font-size: 1.2rem;
        border-radius: 12px;
        border: 2px solid #334155;
        background: #1e293b;
        color: white;
        margin-bottom: 16px;
        text-align: center;
        outline: none;
      }
      .btn-join {
        width: 100%;
        max-width: 320px;
        background: #38bdf8;
        color: #0f172a;
        font-size: 1.2rem;
        font-weight: bold;
        padding: 16px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
      }

      .game-container {
        display: none;
        flex: 1;
        flex-direction: column;
        padding: 16px;
        max-width: 600px;
        margin: 0 auto;
        width: 100%;
      }

      .meta-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 12px;
      }
      .meta-badge {
        background: #0284c7;
        color: white;
        padding: 4px 10px;
        border-radius: 12px;
        font-weight: bold;
      }

      .timer-badge {
        background: #334155;
        color: #38bdf8;
        padding: 4px 12px;
        border-radius: 12px;
        font-weight: 800;
        font-size: 1rem;
        border: 1px solid #38bdf8;
      }
      .timer-badge.danger {
        background: #450a0a;
        color: #ef4444;
        border-color: #ef4444;
      }

      .question-title {
        font-size: 1.15rem;
        line-height: 1.4;
        font-weight: 600;
        margin-bottom: 16px;
        text-align: left;
      }

      .pad-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-bottom: 16px;
      }

      .btn-pad {
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        color: white;
        display: flex;
        align-items: center;
        text-align: left;
        padding: 14px 16px;
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.1s;
      }
      .btn-pad:active {
        transform: scale(0.98);
      }
      .btn-pad:disabled {
        cursor: default;
      }

      .icon-badge {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.25);
        margin-right: 12px;
        flex-shrink: 0;
        font-size: 1rem;
      }

      .p-0 {
        background: #dc2626;
      }
      .p-1 {
        background: #2563eb;
      }
      .p-2 {
        background: #d97706;
      }
      .p-3 {
        background: #16a34a;
      }

      .btn-pad.selected-answer {
        outline: 4px solid white;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
      }
      .btn-pad.correct-answer {
        background: #15803d !important;
        outline: 3px solid #86efac;
      }
      .btn-pad.wrong-answer {
        opacity: 0.35;
        filter: grayscale(80%);
      }

      .feedback-box {
        display: none;
        padding: 14px;
        border-radius: 10px;
        font-size: 1rem;
        margin-bottom: 14px;
        text-align: center;
        font-weight: bold;
      }
      .feedback-box.correct {
        background: rgba(34, 197, 94, 0.2);
        border: 1.5px solid #22c55e;
        color: #86efac;
      }
      .feedback-box.wrong {
        background: rgba(239, 68, 68, 0.2);
        border: 1.5px solid #ef4444;
        color: #fca5a5;
      }

      .explanation-card {
        display: none;
        background: #020617;
        border-left: 4px solid #38bdf8;
        padding: 14px;
        border-radius: 0 8px 8px 0;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #cbd5e1;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <!-- Pantalla de Login -->
    <div class="join-container" id="join-screen">
      <h2 style="margin-bottom: 20px">Frontend Quiz</h2>
      <input
        type="text"
        id="name-input"
        placeholder="Tu Nombre o Nick"
        maxlength="15"
        autofocus
      />
      <button class="btn-join" onclick="joinGame()">Entrar a la partida</button>
    </div>

    <!-- Pantalla de Juego -->
    <div class="game-container" id="game-screen">
      <div class="meta-bar">
        <span class="meta-badge" id="q-category">Categoría</span>
        <span class="timer-badge" id="player-timer">⏱️ 15s</span>
      </div>

      <div class="question-title" id="q-text">
        Conectado. Esperando que el host empiece...
      </div>

      <div class="feedback-box" id="feedback-box"></div>

      <div class="pad-grid" id="pad-buttons"></div>

      <div class="explanation-card" id="explanation-box"></div>
    </div>

    <script>
      const socket = io();
      let myLastAnswer = null;
      const shapes = ["▲", "◆", "●", "■"];

      function joinGame() {
        const name = document.getElementById("name-input").value;
        if (!name.trim()) return;
        socket.emit("player:join", name);
        document.getElementById("join-screen").style.display = "none";
        document.getElementById("game-screen").style.display = "flex";
      }

      socket.on("game:timer", (seconds) => {
        const timerEl = document.getElementById("player-timer");
        timerEl.innerText = `⏱️ ${seconds}s`;
        if (seconds <= 5) {
          timerEl.classList.add("danger");
        } else {
          timerEl.classList.remove("danger");
        }
      });

      socket.on("game:question", (data) => {
        myLastAnswer = null;

        document.getElementById("q-category").innerText = data.category;
        document.getElementById("q-text").innerText = data.question;

        const feedbackBox = document.getElementById("feedback-box");
        feedbackBox.style.display = "none";
        feedbackBox.className = "feedback-box";

        const expBox = document.getElementById("explanation-box");
        expBox.style.display = "none";
        expBox.innerHTML = "";

        const padContainer = document.getElementById("pad-buttons");
        padContainer.innerHTML = data.options
          .map(
            (opt, idx) => `
        <button class="btn-pad p-${idx}" id="btn-${idx}" onclick="sendAnswer(${idx})">
          <span class="icon-badge">${shapes[idx]}</span>
          <span>${opt}</span>
        </button>
      `,
          )
          .join("");
      });

      function sendAnswer(idx) {
        if (myLastAnswer !== null) return;
        myLastAnswer = idx;
        socket.emit("player:answer", idx);

        const buttons = document.querySelectorAll(".btn-pad");
        buttons.forEach((btn, i) => {
          btn.disabled = true;
          if (i === idx) {
            btn.classList.add("selected-answer");
          } else {
            btn.style.opacity = "0.4";
          }
        });

        const feedbackBox = document.getElementById("feedback-box");
        feedbackBox.innerText = "Respuesta enviada. Esperando tiempo...";
        feedbackBox.style.display = "block";
        feedbackBox.style.background = "#1e293b";
        feedbackBox.style.borderColor = "#334155";
        feedbackBox.style.color = "#94a3b8";
      }

      socket.on("game:reveal", (data) => {
        const buttons = document.querySelectorAll(".btn-pad");
        buttons.forEach((btn) => (btn.disabled = true));

        buttons.forEach((btn, idx) => {
          btn.classList.remove("selected-answer");
          if (idx === data.correct) {
            btn.classList.add("correct-answer");
          } else {
            btn.classList.add("wrong-answer");
          }
        });

        const feedbackBox = document.getElementById("feedback-box");
        if (myLastAnswer === null) {
          feedbackBox.innerHTML = "⌛ ¡Se acabó el tiempo!";
          feedbackBox.className = "feedback-box wrong";
        } else if (myLastAnswer === data.correct) {
          feedbackBox.innerHTML = "🎉 ¡Correcto! Punto ganado.";
          feedbackBox.className = "feedback-box correct";
        } else {
          feedbackBox.innerHTML = "❌ Incorrecto";
          feedbackBox.className = "feedback-box wrong";
        }
        feedbackBox.style.display = "block";

        const expBox = document.getElementById("explanation-box");
        expBox.innerHTML = `<strong>Explicación:</strong> ${data.explanation}`;
        expBox.style.display = "block";
      });

      socket.on("game:finished", () => {
        document.getElementById("q-text").innerText =
          "🏆 ¡Quiz finalizado! Mira el podio en la pantalla principal.";
        document.getElementById("pad-buttons").innerHTML = "";
        document.getElementById("feedback-box").style.display = "none";
        document.getElementById("explanation-box").style.display = "none";
      });
    </script>
  </body>
</html>
